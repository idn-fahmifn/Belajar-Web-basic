<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Toko Saya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --var-primary-color: #005a9c;
        --var-secondary-color: #a0e0ef;
        --var-text-primary: #1b365d;
        --var-text-secondary: #f7f7f7;
        --var-text-dark: #343434;
      }

      * {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        overflow-x: hidden;
      }

      body {
        box-sizing: border-box;
      }

      .d-flex{
        display: flex;
      }

      .justify-around{
        justify-content: space-around;
      }

      .direction-col{
        flex-direction: column;
      }

      .center{
        justify-content: center;
        align-items: center;
      }

      .gap-5{
        gap: 32px;
      }

      .text-secondary{
        color: var(--var-text-secondary);
      }

      .header{
        width: 100%;
        padding: 16px 8px;
        background-color: var(--var-primary-color);
      }

      /* memanggil parent navbar dan child li */
      .navbar li{
        display: inline-block;
      }

      .nav-item a{
        color: var(--var-text-secondary);
        text-decoration: none;
        margin-left: 12px;
      }

      .hero{
        width: 100%;
        height: 80dvh;
        background-image: linear-gradient(#34343490), 
        url('https://picsum.photos/1440/');
        background-position: center;
        background-size: cover;
        -webkit-backdrop-filter: blur(24px);
        backdrop-filter: blur(24px);
      }



    </style>
  </head>
  <body>
    <!-- area navbar -->
    <header class="header d-flex justify-around text-secondary">
        <div class="area-logo">
            <p class="logo">Toko <span>Saya</span></p>
        </div>
        <nav>
            <ul class="navbar">
                <li class="nav-item"><a href="">Beranda</a></li>
                <li class="nav-item"><a href="">Layanan</a></li>
                <li class="nav-item"><a href="">Produk</a></li>
                <li class="nav-item"><a href="">Hubungi Kami</a></li>
            </ul>
        </nav>
    </header>
    <!-- end navbar -->

    <main>
        <!-- section hero -->

        <section class="hero d-flex direction-col center gap-5 text-secondary">
            <h1>TOKO <span>SAYA</span></h1>
            <p>Cari produk terbaikmu disini</p>
            <div class="area-button">
                <a href="" class="btn-explore">Selengkapnya</a>
            </div>
        </section>

         <!-- end section -->
    </main>

  </body>
</html>
